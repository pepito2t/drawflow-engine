<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section id="choice-block" hidden>
      <label id="choice-label" for="choice"></label>
      <select id="choice"></select>
    </section>
    <p id="status" class="status" hidden></p>
    <label for="port" data-i18n="pi.port">Port Drawflow</label>
    <input id="port" type="text" placeholder="51717" />
    <label for="token" data-i18n="pi.token">Jeton</label>
    <input id="token" type="password" />
    <p class="hint" data-i18n="pi.hint">
      Laissez vide : le plugin se connecte tout seul à Drawflow installé sur ce poste. À remplir
      seulement si Drawflow tourne sous un autre compte Windows (Drawflow → Paramètres → API
      locale).
    </p>
    <script src="pi.js"></script>
  </body>
</html>
