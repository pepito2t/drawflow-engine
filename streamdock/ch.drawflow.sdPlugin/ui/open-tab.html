<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <label for="choice">Onglet</label>
    <select
      id="choice"
      data-setting="moduleId"
      data-source="getModules"
      data-placeholder="Choisir un onglet"
    ></select>
    <label for="port">Port Drawflow</label>
    <input id="port" type="text" placeholder="51717" />
    <label for="token">Jeton</label>
    <input id="token" type="password" />
    <p class="hint">Port et jeton : Drawflow → Paramètres → Intégrations (activer l'API locale).</p>
    <script src="pi.js"></script>
  </body>
</html>
