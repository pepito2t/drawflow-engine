name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Releases may be published to a separate public repository so the updater can read them.
      RELEASES_OWNER: ${{ vars.RELEASES_OWNER || github.repository_owner }}
      RELEASES_REPO: ${{ vars.RELEASES_REPO || github.event.repository.name }}
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The CI matrix (macOS, Windows, Ubuntu) already tested this commit when it reached main or a
      # pull request: reusing its verdict costs seconds, rerunning the suites here would cost minutes.
      - name: CI is green on the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          commit="$(git rev-parse HEAD)"
          run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${commit}&per_page=1" --jq '.workflow_runs[0].id // empty')"
          if [[ -z "$run_id" ]]; then
            echo "::error::Aucune exécution de la CI pour le commit ${commit} : poussez-le sur main (ou ouvrez une PR), attendez la CI, puis posez le tag."
            exit 1
          fi
          echo "CI run ${run_id} : https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          if ! gh run watch "$run_id" --exit-status --interval 30; then
            echo "::error::La CI n'est pas verte sur le commit ${commit} (run ${run_id}) : corrigez, fusionnez, puis posez le tag sur le commit corrigé."
            exit 1
          fi

      - name: Signing secrets present
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_PUBKEY: ${{ vars.UPDATER_PUBKEY }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY manquant : générez la clé avec 'pnpm tauri signer generate' et ajoutez-la aux secrets du repo."
            exit 1
          fi
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD manquant : la clé de signature est protégée par mot de passe (voir README, Releasing)."
            exit 1
          fi
          if [[ -z "$UPDATER_PUBKEY" ]]; then
            echo "::error::Variable UPDATER_PUBKEY manquante : ajoutez la clé publique générée par 'pnpm tauri signer generate' aux variables du repo."
            exit 1
          fi

      - name: Updater configuration
        env:
          UPDATER_PUBKEY: ${{ vars.UPDATER_PUBKEY }}
        run: |
          endpoint="https://github.com/${RELEASES_OWNER}/${RELEASES_REPO}/releases/latest/download/latest.json"
          python - "$endpoint" > updater-config.json <<'PY'
          import json, os, sys
          print(json.dumps({"plugins": {"updater": {
              "pubkey": os.environ["UPDATER_PUBKEY"],
              "endpoints": [sys.argv[1]],
              "windows": {"installMode": "passive"},
          }}}))
          PY

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Rust channel from rust-toolchain.toml
        id: rust
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' src-tauri/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - run: uv sync --locked --project engine
      - name: Version matches tag and changelog is ready
        run: uv run --project engine python scripts/version.py check --tag "${GITHUB_REF_NAME}"
      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          {
            echo "body<<CHANGELOG_SECTION"
            uv run --project engine python scripts/version.py notes
            echo "CHANGELOG_SECTION"
          } >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile
      - name: Build sidecar
        run: ./scripts/build-sidecar.sh
      - name: Smoke test frozen sidecar
        run: uv run --project engine python scripts/smoke-sidecar.py "$(ls src-tauri/binaries/engine-*)"

      # The release stays a draft until the Stream Dock plugin is attached: the updater and the
      # users only ever see a complete release.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ env.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Drawflow ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          owner: ${{ env.RELEASES_OWNER }}
          repo: ${{ env.RELEASES_REPO }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis --config updater-config.json -- --locked

      - name: Build Stream Dock plugin
        working-directory: streamdock
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm run package

      - name: Attach Stream Dock plugin to the release
        env:
          GH_TOKEN: ${{ env.RELEASES_TOKEN }}
        run: >
          gh release upload "${GITHUB_REF_NAME}" streamdock/dist/ch.drawflow.sdPlugin.zip
          --repo "${RELEASES_OWNER}/${RELEASES_REPO}" --clobber

      - name: Publish the release
        env:
          GH_TOKEN: ${{ env.RELEASES_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --repo "${RELEASES_OWNER}/${RELEASES_REPO}"
