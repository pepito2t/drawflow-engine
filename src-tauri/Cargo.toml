[package]
name = "drawflow"
version = "0.20.0"
description = "Automatisation des tâches du dessinateur en façade"
edition = "2021"
rust-version = "1.85"

[lib]
name = "drawflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-shell = "2.4"
tauri-plugin-notification = "2.5"
tauri-plugin-updater = "2.13"
tauri-plugin-process = "2.4"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"
thiserror = "2"
tokio = { version = "1.53", features = ["net", "sync", "time", "macros", "rt"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
argon2 = "0.6"
subtle = "2.6"
password-hash = { version = "0.6", features = ["getrandom"] }
getrandom = "0.4"
notify = "8"
sha2 = "0.11"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[dev-dependencies]
tokio = { version = "1.53", features = ["rt", "macros"] }
