[project]
name = "engine"
version = "0.20.0"
description = "Moteur de traitement drawflow-engine (sidecar Tauri)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "docxtpl>=0.20.2,<0.21",
    "ezdxf>=1.4.4,<2",
    "httpx>=0.28,<1",
    "mcp>=1,<2",
    "openpyxl>=3.1.5,<4",
    "pdfplumber>=0.11.10,<0.12",
    "pydantic>=2.13,<3",
    "pypdf>=6,<7",
]

[project.scripts]
engine = "engine.cli:main"

[dependency-groups]
dev = [
  "mypy>=2.4",
  "pyinstaller>=6.22",
  "pytest>=9.1",
  "pytest-timeout>=2.4",
  "ruff>=0.16",
  "types-openpyxl>=3.1.5.20260827",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PTH", "T20"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["PyInstaller.*", "docxtpl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "src/engine/modules", "src/engine/parts"]
addopts = ["--import-mode=importlib", "-ra"]
markers = ["oda: requires ODA File Converter (skipped when absent)"]
# A hung test fails with the stack of every thread instead of blocking CI.
timeout = 120
